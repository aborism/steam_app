name: Streamlit Keep Alive

on:
  schedule:
    # 30分ごとに実行 (サーバーの負荷を考慮し、短すぎない間隔に設定)
    - cron: '*/30 * * * *'
  # 手動実行用 (テストや緊急時のために追加)
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Streamlit App
        env:
          # URLを直接ファイルに設定
          APP_URL: "https://steam-arcana.streamlit.app/"
        run: |
          echo "Pinging $APP_URL to keep it alive..."
          curl -I -s --fail "$APP_URL" > /dev/null
          
          if [ $? -eq 0 ]; then
            echo "Successfully pinged the app."
          else
            echo "Failed to ping the app."
            exit 1
          fi
